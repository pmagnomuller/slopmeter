[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slopmeter"
version = "0.4.0"
description = "Codebase observatory: LOC, attention-gap slop, and longitudinal waste findings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
slopmeter = "slopmeter.__main__:main"

[tool.setuptools.packages.find]
include = ["slopmeter*"]

[tool.setuptools.package-data]
slopmeter = ["*.html"]
